# Near-duplicate clustering threshold (M2 Task 4, docs/superpowers/plans/
# 2026-08-14-m2-scoring.md). Consumed by src/cluster/config.ts. This is the
# one dial src/cluster/ exposes: how similar do two titles' word-trigram
# shingle sets need to be (Jaccard, 0..1) before the two items they belong to
# are treated as the same near-duplicate story and written into one cluster
# (src/cluster/store.ts). Retuning this is a config edit, never a code
# change -- validated by src/cluster/config.ts's Zod schema at load time, so
# a typo'd or out-of-range value fails loudly at startup, not silently at
# clustering time.
#
# ---------------------------------------------------------------------------
# Why 0.10, evidence-based -- full derivation in
# .superpowers/sdd/2026-08-14-m2-scoring/task-4-report.md
# ---------------------------------------------------------------------------
#
# Validated against the real first-live-ingest corpus
# (attic/wf-m1-firstrun-2026-08-14.db, read-only, never opened by code): all
# 180 usnews titles (150 ap-news + 20 pbs-newshour + 10 npr-news), every
# pairwise trigram Jaccard score computed exhaustively (~16,110 pairs).
#
# The three required "should cluster" pairs from the task brief:
#   settler siege (npr/pbs)   2/17 = 0.1176
#   Mangione (npr/pbs)        2/16 = 0.1250
#   Kennedy Center (npr/pbs)  1/17 = 0.0588   <- see below, NOT caught
#
# The two required "must NOT cluster" traps:
#   Ukraine drone strikes (npr/pbs, different events)          0/16 = 0.0000
#   settler siege vs. family-recounts-it (pbs/pbs, same source) 0/18 = 0.0000
#
# The highest CONFIRMED SPURIOUS score found anywhere in the exhaustive
# 180-title sweep -- two different, unrelated AP transactions ("Mariners to
# send rookie shortstop Emerson to Triple-A, AP source says" / "Seahawks,
# cornerback Terrion Arnold are working on a deal, AP source says") that
# collide purely on AP's own recurring sourcing boilerplate:
#   "AP source says" boilerplate (ap-news/ap-news)   1/13 = 0.0769
#
# 0.0769 < 0.10 < 0.1176: the chosen threshold sits strictly between the
# worst confirmed false-positive risk and the weaker of the two pairs this
# threshold guarantees catching, with real margin on both sides (not a
# knife-edge fit to one example).
#
# THE HONEST COST, stated plainly rather than tuned away: Kennedy Center
# (1/17 = 0.0588) is BELOW the confirmed-spurious ceiling (0.0769), so no
# threshold can catch it without also catching that spurious pair (or a
# second one at the identical 0.0588: two unrelated Spanish-language AP
# product-recall notices sharing a wire template). Per this task's explicit
# "prefer under-clustering" mandate -- a false merge manufactures cluster-size
# signal the mechanical scorer would trust; a missed duplicate only fails to
# boost -- Kennedy Center is a deliberate miss, not an oversight. It still
# clusters correctly through OTHER real pairs: the mechanical scorer sees
# Mangione's full 3-source pickup (npr+pbs+ap-news) because npr~pbs (0.1250)
# and ap-news~pbs (0.2500) both clear 0.10, uniting all three through pbs as
# the hub, even though npr~ap-news scores exactly 0 directly (see
# src/cluster/group.ts and its tests for the transitive-grouping mechanism
# this relies on).
#
# Two source-level risks checked and found NOT to produce false positives at
# this threshold: AP's Spanish-language wire copy (its own internal near-
# duplicates, e.g. two recall notices, top out at 0.0588 -- below 0.10) and
# AP's templated sports headlines ("X scores N points as/and Y ..." on two
# different WNBA games; "X throws TD pass..." on two different preseason
# games) -- the WNBA template scores exactly 0 and the TD-pass template tops
# out at 0.0556, both below 0.10.
near_duplicate_threshold: 0.1

# ---------------------------------------------------------------------------
# FIX ROUND 1 -- max_bridge_document_frequency. Full derivation and evidence
# in .superpowers/sdd/2026-08-14-m2-scoring/task-4-report.md's fix-round-1
# section; mechanism documented in src/cluster/group.ts's module doc comment.
# ---------------------------------------------------------------------------
#
# WHAT WENT WRONG, briefly: the 180-title validation above (all usnews) never
# exercised a formulaic, templated corpus. A fresh, full, real 4,134-item
# ingest (all beats) produced a single 1,543-member cluster (37% of the
# entire corpus, 100% cisa-kev) and a 28-member cluster (100%
# huggingface-blog). No individual pair score was wrong -- most pairs
# anywhere in the corpus score exactly 0 -- but a handful of generic
# vulnerability-class/AI-research phrases ("remote code execution", document
# frequency 196 of 4,134; "large language models", 30) bridge otherwise-
# unrelated items, and transitive (single-link) grouping welds those bridges
# into one enormous, meaningless component.
#
# TWO independent defenses fix this (both live in src/cluster/group.ts, not
# configured here beyond this one cap):
#
#   1. Cross-source only -- two candidates sharing a source_id are never
#      merged, full stop. This ALONE fully eliminates both real pathological
#      clusters above (both were 100% single-source) and needs no config
#      value at all.
#   2. Boilerplate trigram filtering -- ANY trigram whose document frequency
#      across the whole candidate set exceeds the value below is dropped
#      from every candidate's shingle set before Jaccard is computed. This
#      catches a SEPARATE, smaller real case cross-source-only cannot: real
#      arxiv-cs-ai / huggingface-blog titles about unrelated "vision-language
#      model" papers and posts, bridged purely by that phrase (their own
#      corpus document frequency: 9).
#
# WHY 5: the largest genuine cross-source corroboration found in the fresh
# 4,134-item corpus is a real 3-outlet story (a Niger-missionary release,
# pbs-newshour/npr-news/ap-news), whose bridging trigrams have document
# frequency 2-3. Confirmed boilerplate starts at document frequency 9
# ("vision language models") and runs into the hundreds ("remote code
# execution", 196). 5 sits with real margin above the largest confirmed-
# genuine case (3) and well below where confirmed boilerplate starts (9+) --
# the same "margin on both sides, not a knife-edge fit" reasoning already
# used above for near_duplicate_threshold. Verified directly against both
# real regression cases (the cisa-kev CVE chain and the arxiv/huggingface
# "vision-language model" false merge) in tests/cluster/group.test.ts.
#
# Optional in the schema (src/cluster/config.ts) so a config literal
# predating this fix round keeps working via src/cluster/group.ts's own
# default -- but stated explicitly here regardless, matching every other
# config file in this codebase never relying on an implicit code default.
max_bridge_document_frequency: 5
