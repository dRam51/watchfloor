    # prefix. This exact URL was verified live: 200, a genuine WordPress RSS 2.0 feed
    # titled "Presidential Actions – The White House", self-referencing correctly.
    # robots.txt (www.whitehouse.gov) is allow-all (bare "Disallow:" under "User-agent: *").
