# Every feed Watchfloor reads. Adding a source is a config edit, never a code change.
# Validated by src/sources/load.ts at startup; a bad entry stops the process.
#
# Required — every one of these, on every source:
#
#   id            unique, stable, kebab-case ([a-z0-9] then [a-z0-9-])
#   name          human-readable label, shown in the UI and source-health page
#   type          rss | atom | json | news_sitemap | google_news | github_search | api | market_data
#                 (only rss, atom, json, news_sitemap, and google_news have an adapter as of M1;
#                 github_search/api/market_data are M4a/M4b and will fail to route if used now)
#   url           absolute feed URL
#   beats         one or more of: ai, cyber, aisec, repos, markets, usnews
#   weight        0.1–2.0 trust multiplier (feeds M2 scoring)
#   poll_interval e.g. 15m, 6h, 1d (nonzero leading digit required — a zero interval
#                 defeats backoff, see src/sources/load.ts)
#   enabled       true | false — false keeps the entry but stops polling it
#
# Optional:
#
#   filters       free-form map, interpreted per source type. Validated by
#                 src/sources/load.ts's Zod schema on a per-key basis — a key the schema
#                 knows about is checked for real (a malformed value fails config load, not
#                 just fetch-time silence); every other key stays free-form and is passed
#                 through unvalidated. As of fix-ap-language-filter, ONE key is actually
#                 consumed:
#                   languages   news_sitemap only. Allow-list of ISO 639-2/B three-letter
#                               codes (e.g. [eng]) — an entry whose declared
#                               <news:language> is not in this list is dropped at ingest
#                               and never stored (src/adapters/newsSitemap.ts). No
#                               `filters.languages` on a source means no language
#                               filtering at all — never an implicit English-only default.
#                               An entry whose language cannot be determined is always
#                               kept, regardless of this list. See
#                               fix-ap-language-filter-report.md
#                               (.superpowers/sdd/2026-08-14-m2-scoring/, gitignored,
#                               local-only) for the full reasoning.
#                 Every other key below (`keywords` on arxiv-cs-cr, `min_points`+`keywords`
#                 on hn-algolia) is still NOT YET CONSUMED by any adapter — present only as
#                 forward documentation of intent for later M2 filtering work.
#   tier          markets sources only: event | analysis
#   kind          news | paper | blog | advisory | aggregator -- a CONTENT axis, orthogonal
#                 to `beats` (a TOPIC axis). `beat` alone cannot express "aisec, but only
#                 news": aisec is structurally a papers beat today (arxiv-cs-cr + two
#                 research blogs, zero news), and `item_type` was tried as the filter for
#                 exactly this job and found effectively binary in practice (M2: `press`
#                 matches 0 of 3,325 real items) -- so this is a NEW field, not a
#                 repurposing of the old one. Optional (like `tier`), validated by
#                 src/sources/load.ts's Zod schema when present -- an unrecognized value
#                 fails config load, same as every other field here.
#
#                 SOURCE-LEVEL, deliberately, not item-level. A source's kind is stable and
#                 honest -- arXiv is always papers, CISA's feeds are always advisories -- so
#                 classifying it once, here, is cheap and correct. An item-level classifier
#                 is what `item_type` already tried and failed at (see above): individual
#                 articles vary in form in ways a per-source label cannot capture, but a
#                 SOURCE'S overall editorial format does not vary. This is deliberately the
#                 cheap axis, not the clever one -- the point is a filter the owner can use
#                 (`?kind=news` on `/api/feed`), not taxonomic elegance.
#
#                 The five values, and why these five:
#                   news        third-party journalism/wire reporting -- AP, NPR, PBS,
#                               Ars Technica, VentureBeat, The Hacker News, Dark Reading.
#                               What the owner means by "news articles" in "I want news
#                               articles, not white papers."
#                   paper       academic preprints -- arXiv. The other half of that complaint.
#                   blog        practitioner/company/independent blogs and newsletters --
#                               Simon Willison, Latent Space, Krebs, Project Zero, OWASP,
#                               deepmind-blog, huggingface-blog, Import AI, OpenAI's own
#                               blog, vendor research blogs (Rapid7, Cisco Talos). Distinct
#                               from `news`: first-person/vendor voice rather than
#                               third-party reporting, even when (Krebs, Project Zero) the
#                               content itself is investigative or breaking.
#                   advisory    official, structured primary-source publications -- CISA
#                               KEV, CISA advisories, NVD, Federal Register, White House
#                               Presidential Actions. Not journalism about an event; the
#                               government or vendor's own declaration OF the event.
#                   aggregator  a feed whose items originate elsewhere and are merely
#                               surfaced/ranked here -- hn-algolia (Hacker News via Algolia)
#                               is the only one today.
#   enrichment    true | false, default true (AP-only in M1, set false below). Validated by
#                 src/sources/load.ts's Zod schema — a non-boolean value fails config load,
#                 not just a comment's say-so. Still NOT YET CONSUMED by any M1 code (the
#                 enrichment pass itself is a later milestone); this field's job today is to
#                 record the decision (AP's robots.txt blocks AI crawlers by name; AP items
#                 must never reach an LLM) so it survives until a consumer exists — see
#                 task-11-report.md and fix-enrichment-field-report.md.
#
# M1 weight bands (see task-11-report.md for full per-source reasoning):
#   2.0       hard-override: CISA KEV, and government primaries whose documents ARE the news
#             (Federal Register, White House actions). SCOTUS opinions and NWS alerts were
#             also planned at this tier but are NOT configured below — see the two robots.txt
#             findings in task-11-report.md.
#   1.5–1.8   high-trust, low-editorial: AP, Reuters, NPR, PBS, NVD, established security
#             research (Project Zero).
#   1.2–1.4   strong practitioner/trade writing: Simon Willison, Latent Space, Krebs,
#             BleepingComputer, vendor research blogs, OWASP.
#   0.8–1.1   high-volume/high-noise: arXiv feeds, Hacker News.
#
# Every source below is currently enabled: true. Two — nvd-cve and project-zero — spent
# time disabled during M1/early M2 while their adapter-level blockers (an unfiltered/
# unpaginated NVD query; project-zero's unbounded response with no per-source byte
# ceiling) were fixed; see each entry's own comment for what changed and
# fix-disabled-sources-report.md (.superpowers/sdd/2026-08-13-m1-ingest/, gitignored,
# local-only) for the full investigation and both fix rounds.
sources:
  # ---------------------------------------------------------------------------
  # cyber
  # ---------------------------------------------------------------------------

  - id: cisa-kev
    name: CISA Known Exploited Vulnerabilities
    type: json
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    beats: [cyber]
    weight: 2.0
    poll_interval: 30m
    kind: advisory
    enabled: true

  - id: cisa-advisories
    name: CISA Cybersecurity Advisories
    type: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    beats: [cyber]
    weight: 1.7
    poll_interval: 1h
    kind: advisory
    enabled: true

  # ENABLED (fix round 2, tail pagination) — live-verified 2026-08-14. NVD API 2.0
  # exposes no sort parameter; its stable order is ascending by CVE id/publication
  # (NOT by lastModified, as an earlier round of this fix wrongly assumed), so the
  # newest entries sit at the HIGHEST indices, not the lowest. A forward walk from
  # startIndex=0 — the design this source was originally re-enabled with — retrieved
  # the OLDEST ~1,000 entries in the date window on every single poll (CVE-1999-0095
  # first, always: entry 1 of the unfiltered catalog) and never a current one, which
  # was the exact defect this comment used to name as the reason for disabling the
  # source in the first place, just relocated one layer down.
  #
  # src/adapters/json.ts now spends the first request of every poll on a cheap
  # total-discovery probe (resultsPerPage=1), then anchors near the reported
  # `totalResults` and walks forward from there — see nvdAnchorPageUrl's doc comment
  # for the full mechanism (the moving-total race between requests, and the
  # negative-startIndex clamp for once the date window's own total shrinks back to a
  # normal size). Live-verified against this exact, real source: one poll retrieves
  # 800 of the newest entries (head CVE-2026-72799, published 2026-08-12; tail
  # CVE-2026-73633, published 2026-08-14 — the day this was verified); a full
  # 200-entry real page measured ~554 KB live, comfortably under politeFetch's 5 MiB
  # default ceiling (no MAX_BYTES_OVERRIDES entry needed for this source).
  # AdapterResult.capped on this source now reports entries missed off the OLD end of
  # the window — already-seen history — not the new end, a materially less alarming
  # gap than what the same field name reported before this fix. resultsPerPage/
  # startIndex are not in the url below: both are entirely code-owned (see
  # NVD_RESULTS_PER_PAGE's own doc comment, src/adapters/json.ts, for why a
  # config-owned page size was Finding 1's original root cause).
  - id: nvd-cve
    name: NVD CVE Database (API 2.0)
    type: json
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    beats: [cyber]
    weight: 1.6
    poll_interval: 3h
    kind: advisory
    enabled: true

  # kind: news, not blog -- Krebs is investigative/breaking-news reporting on breaches and
  # vulnerabilities (what the owner means by "news"), even though the weight-band note above
  # groups it with the practitioner-blog tier on TRUST/EDITORIAL-VOICE grounds. Trust and
  # content-kind are different axes; this file's own weight band is not a kind label.
  - id: krebs
    name: Krebs on Security
    type: rss
    url: https://krebsonsecurity.com/feed/
    beats: [cyber]
    weight: 1.3
    poll_interval: 6h
    kind: news
    enabled: true

  - id: bleepingcomputer
    name: BleepingComputer
    type: rss
    url: https://www.bleepingcomputer.com/feed/
    beats: [cyber]
    weight: 1.3
    poll_interval: 3h
    kind: news
    enabled: true

  # ENABLED — the plan's verified URL (googleprojectzero.blogspot.com, which needed
  # ?max-results=25 to stay under ~13 MB) now permanently 302-redirects to a new site,
  # https://projectzero.google/feed.xml (Blogger has been retired in favor of a static
  # Jekyll site). The new feed.xml has NO pagination/bounding mechanism of any kind —
  # verified live that ?max-results=25, ?start-index=N, and &alt=rss are all inert on it
  # (Jekyll serves one static file regardless of query string), and no alternate bounded
  # path exists (/feeds/posts/default, /rss.xml, /atom.xml, /feed.json, /sitemap.xml all
  # 404).
  #
  # src/fetch/http.ts's politeFetch now carries a per-source byte-ceiling override
  # (MAX_BYTES_OVERRIDES, keyed by this url's exact string) rather than a bounded url,
  # since none exists — DEFAULT_MAX_BYTES stays 5 MiB for every other source; only this
  # one url's ceiling is raised, to 20 MiB. The ongoing cost is far rarer than the raw
  # byte count suggests: this feed genuinely honors conditional GET (live-verified: a
  # real 304, 0 bytes downloaded), and src/adapters/rss.ts already sends state's own
  # etag/lastModified on every poll — the full ~12.6 MB body is only ever paid on a
  # cold start or a poll where the feed's content genuinely changed, not every 12h.
  #
  # CORRECTED 2026-08-14: an earlier version of this comment called the feed "a complete,
  # ever-growing history dump". It is not. Live measurement: exactly 10 <entry> elements,
  # spanning 2025-12-16 to 2026-05-13 — a ROLLING WINDOW of roughly five months, not the
  # ~12-year archive Project Zero has actually published. The 13 MB is ~1.3 MB per post,
  # and one single line of it is 3,586,934 bytes: an embedded data-URI image. So the
  # ceiling's real risk is variance in a single post's size, not accumulation, and a
  # rolling window also means posts published beyond the newest 10 fall off with no
  # back-fill path. Neither matters at ~2 posts/month against a 12h poll, but both are
  # different risks from the one originally written down here. Full figures and reasoning
  # in MAX_BYTES_OVERRIDES's own doc comment.
  - id: project-zero
    name: Google Project Zero
    type: rss
    url: https://projectzero.google/feed.xml
    beats: [cyber, aisec]
    weight: 1.6
    poll_interval: 12h
    kind: blog
    enabled: true

  # ---------------------------------------------------------------------------
  # aisec
  # ---------------------------------------------------------------------------

  - id: arxiv-cs-cr
    name: arXiv — Cryptography and Security (cs.CR)
    type: rss
    url: https://rss.arxiv.org/rss/cs.CR
    beats: [aisec]
    weight: 0.9
    poll_interval: 1d
    kind: paper
    filters:
      # Not yet consumed by src/adapters/rss.ts (M1) — forward documentation for M2,
      # matching this source's plan note ("filter for LLM/agent/prompt-injection
      # terms"). cs.CR's daily volume is broad computer-security research; most of it
      # is out of scope for the aisec beat's specifically LLM/agent focus.
      keywords: ["prompt injection", jailbreak, "large language model", LLM, agent]
    enabled: true

  - id: owasp-genai
    name: OWASP GenAI Security Project
    type: rss
    url: https://genai.owasp.org/feed/
    beats: [aisec]
    weight: 1.3
    poll_interval: 12h
    kind: blog
    enabled: true

  # fix-news-sources-and-kind task (2026-08-14). Closes the headline gap this task exists
  # for: aisec had ZERO kind:news sources before this (67 items — 47 arXiv papers, 20
  # research-blog posts, newest 93 days old). The four sources below are general
  # cybersecurity trade press/vendor-research outlets, dual-tagged [cyber, aisec] on the
  # same precedent as project-zero above: they are not AI-security-exclusive publications,
  # but AI-security content (prompt injection, LLM/agent vulnerabilities, model-provider
  # incidents) is a real, regularly-recurring subset of what each one covers — see the
  # live samples quoted per source below. Every one of the four was live-verified against
  # the real robots gate (src/fetch/robots.ts's fetchRobots/isAllowed, not judgment) and
  # for genuinely fresh, parseable content (dates printed) — see
  # fix-news-sources-and-kind-report.md (.superpowers/sdd/2026-08-14-m3-api-dashboard/,
  # gitignored, local-only) for the full evidence, including the robots.txt text for
  # every host in each chain.

  # kind: news — cybersecurity trade press (breaking vulnerability/breach reporting), not a
  # vendor or personal blog. thehackernews.com's own feed 302-redirects to this exact URL
  # (feeds.feedburner.com/TheHackersNews) by the publisher's own design — this is the
  # sanctioned distribution path, not a Reuters-style indirect workaround, and both hosts in
  # that redirect chain were checked independently: thehackernews.com's robots.txt is
  # allow-all (bare "Disallow:" under "User-agent: *"), and feeds.feedburner.com's
  # /robots.txt returns 200 with a generic app-shell HTML body (RaichuFeedServer's catch-all
  # "lander" page, not a real robots.txt — content-length 0 on a HEAD request, a 114-byte
  # HTML redirect stub on GET) that contains no "User-agent:" field at all — src/fetch/
  # robots.ts's isAllowed correctly reads that as silence (RFC 9309: a file that never
  # mentions an agent says nothing about us), not ambiguity, per that module's own documented
  # reasoning. Configured directly against feeds.feedburner.com to skip the redirect hop.
  # Live-verified 2026-08-14, 50 entries, newest 37.8h old at verification time (e.g.
  # "Attackers Exploit SharePoint Authentication Bypass After Public PoC Re…"), several
  # AI-security-relevant (e.g. "OpenAI, Anthropic, Google API Flaw Let Weaker AI Models
  # Decode Stronger…").
  - id: the-hacker-news
    name: The Hacker News
    type: rss
    url: https://feeds.feedburner.com/TheHackersNews
    beats: [cyber, aisec]
    weight: 1.3
    poll_interval: 2h
    kind: news
    enabled: true

  # kind: news — long-established enterprise/cybersecurity trade publication. robots.txt
  # (www.darkreading.com) allows the general `*` group everywhere except a handful of
  # operational paths (/search, /api/health, ...), but carries a SEPARATE named group
  # listing ClaudeBot/Claude-Web/Anthropic-ai/GPTBot/CCBot/etc. with `Disallow: /` — the
  # same shape as AP's own robots.txt (config/sources.yaml's ap-news entry, and the
  # `enrichment` field's own doc comment in src/sources/load.ts). Our product token
  # ("watchfloor") does not match any of those named agents, so the named group never
  # applies to us and fetching stays permitted — but the SAME "the operator has an opinion
  # about AI crawlers even though it isn't literally about us" reasoning that put
  # `enrichment: false` on ap-news applies here too. Set below, not left at the default.
  # Live-verified 2026-08-14, 50 entries, newest 0.6h old (e.g. "Mission-Driven Security:
  # Inside a Global Bank's Defense"), AI-security-relevant coverage present (e.g.
  # "Amid AI-Driven Bug-Hunt Tsunami, NIST Looks to … AI").
  - id: dark-reading
    name: Dark Reading
    type: rss
    url: https://www.darkreading.com/rss.xml
    beats: [cyber, aisec]
    weight: 1.4
    poll_interval: 2h
    kind: news
    enrichment: false
    enabled: true

  # kind: blog — Rapid7's own security-research team, not third-party reporting (matches
  # this file's weight-band header, which already groups "vendor research blogs" at
  # 1.2–1.4). robots.txt (www.rapid7.com) is a plain `*` group disallowing only a handful
  # of operational paths (no AI-crawler-specific block found). Configured against the
  # post-redirect URL (the bare /blog/rss/ path 301s here) to avoid an unnecessary hop.
  # Live-verified 2026-08-14, 20 entries, newest 55.0h old (e.g. "AI is Working in the SOC.
  # So Why are Security Executives More Worried…" and CVE-2026-63520/SharePoint RCE
  # analysis — genuinely AI-security-adjacent as well as general vulnerability research).
  - id: rapid7
    name: Rapid7 Blog
    type: rss
    url: https://www.rapid7.com/rss.xml
    beats: [cyber, aisec]
    weight: 1.2
    poll_interval: 6h
    kind: blog
    enabled: true

  # kind: blog — Cisco Talos's own threat-research team, same category as project-zero
  # above (vendor/company security research, not third-party news). robots.txt
  # (blog.talosintelligence.com) is the simplest possible allow-all: `User-Agent: * /
  # Allow: /`, no exceptions of any kind. Configured against the direct feed
  # (/rss/ — discovered via the site's own <link rel=alternate> tag), not the feedburner
  # mirror also found live (feeds.feedburner.com/feedburner/Talos also 200s with the same
  # content) — simpler chain, one host, already fully open.
  # Live-verified 2026-08-14, 15 entries, newest 26.0h old (e.g. "Curiouser and
  # Curiouser"), general threat-research cadence (~1 post every 2–3 days).
  - id: cisco-talos
    name: Cisco Talos Intelligence Blog
    type: rss
    url: https://blog.talosintelligence.com/rss/
    beats: [cyber, aisec]
    weight: 1.3
    poll_interval: 12h
    kind: blog
    enabled: true

  # ---------------------------------------------------------------------------
  # ai
  # ---------------------------------------------------------------------------

  - id: arxiv-cs-ai
    name: arXiv — Artificial Intelligence (cs.AI)
    type: rss
    url: https://rss.arxiv.org/rss/cs.AI
    beats: [ai]
    weight: 0.9
    poll_interval: 1d
    kind: paper
    enabled: true

  - id: simonwillison
    name: Simon Willison's Weblog
    type: rss
    url: https://simonwillison.net/atom/everything/
    beats: [ai]
    weight: 1.4
    poll_interval: 6h
    kind: blog
    enabled: true

  - id: latent-space
    name: Latent Space
    type: rss
    url: https://www.latent.space/feed
    beats: [ai]
    weight: 1.2
    poll_interval: 12h
    kind: blog
    enabled: true

  - id: deepmind-blog
    name: Google DeepMind Blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    beats: [ai]
    weight: 1.4
    poll_interval: 6h
    kind: blog
    enabled: true

  - id: huggingface-blog
    name: Hugging Face Blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    beats: [ai]
    weight: 1.2
    poll_interval: 6h
    kind: blog
    enabled: true

  # FIXED 2026-08-14 (fix-hn-algolia-sort task) — Algolia's plain /search endpoint sorts by
  # RELEVANCE, and with no query term (tags=story alone is not a query, just a filter) that
  # means all-time popularity: this url returned the same handful of all-time-classic
  # stories on EVERY poll, forever, regardless of poll_interval — the same defect class as
  # nvd-cve's wrong-sort trap above (a plausible-looking parameter that quietly never
  # surfaces new content). Live-verified 2026-08-14 against the OLD url
  # (search?tags=story&hitsPerPage=20):
  #   3075d old | 6015 pts | Stephen Hawking has died
  #   3831d old | 5771 pts | A Message to Our Customers
  #   5426d old | 4338 pts | Steve Jobs has passed away.
  #   1105d old | 4310 pts | Bram Moolenaar has died
  # Nothing recent, and — on a source whose beat is `ai` — nothing AI-related either.
  #
  # /search_by_date sorts by recency instead, but alone swings to the opposite failure:
  # brand-new submissions minutes old, usually 0-1 points, with no signal yet either way.
  # numericFilters=points%3E50 (URL-encoded points>50) restores a quality floor — exactly
  # what this source's own `filters: min_points: 50` below already documented as intended,
  # now actually enforced (via the url, not adapter code — src/adapters/json.ts still reads
  # no filter keys itself). Live-verified 2026-08-14 against the NEW url below, substantive
  # and organically AI-heavy with no keyword filtering needed at all:
  #    0.6h old | 108 pts | Qwen3.8-27B
  #    5.4h old | 353 pts | Why does Opus 5 feel worse to work with?
  #    5.7h old | 170 pts | DeepSeek peak/off-peak pricing update
  #   10.3h old | 834 pts | GLM-5.3: Frontier coding with emergent cyber capabilities
  - id: hn-algolia
    name: Hacker News (via Algolia)
    type: json
    url: https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=points%3E50&hitsPerPage=20
    beats: [ai]
    weight: 0.9
    poll_interval: 1h
    kind: aggregator
    filters:
      # min_points is now CONSUMED — via numericFilters=points>50 in the url above, not by
      # any adapter code (src/adapters/json.ts still reads no filter keys for this source;
      # Algolia itself does the filtering, server-side). Recorded here so the decision
      # stays documented even though the enforcement mechanism is the url, not this field.
      # keywords remains NOT YET CONSUMED by any adapter — still forward documentation for
      # later M2 filtering work, matching this source's plan note.
      min_points: 50
      keywords: [ai, llm, "large language model", agent, anthropic, openai, gemini, claude, gpt]
    enabled: true

  # fix-news-sources-and-kind task (2026-08-14). ai's existing coverage is 5% actual
  # news/commentary (70 of 1,318 items) — the rest is huggingface-blog tutorials/model
  # cards (median age 767 days) and arXiv papers. The four sources below were the ones
  # named as "verified during M1 planning" but never configured; each was re-verified live
  # against the real robots gate, not the old claim — see fix-news-sources-and-kind-report.md
  # (.superpowers/sdd/2026-08-14-m3-api-dashboard/, gitignored, local-only) for the full
  # evidence.

  # kind: news — Ars Technica's AI-category feed, NOT its site-wide /feed/ (verified live:
  # the site-wide feed mixes in unrelated sections — an all-electric aircraft test flight, a
  # sports-betting court order — the same beat-pollution risk a merged feed always carries).
  # robots.txt (arstechnica.com) allows the general `*` group broadly (only wp-admin/
  # trackback/search-style paths excluded), but — same shape as ap-news and dark-reading
  # above — carries a separate named group listing ClaudeBot/Claude-SearchBot/Claude-User/
  # Claude-Web/anthropic-ai/CCBot/PerplexityBot/etc. with `Disallow: /`. Our token doesn't
  # match those names, so fetching stays permitted, but `enrichment: false` is set for the
  # same reason it is on ap-news and dark-reading: the operator has a declared opinion about
  # AI crawlers even though it isn't literally naming ours.
  # Live-verified 2026-08-14 against /ai/feed/ specifically: newest entry 1.4h old
  # ("Vulnerability giving attackers full control of Macs is under active ex…"), every
  # sampled title genuinely AI-related.
  - id: ars-technica-ai
    name: Ars Technica — AI
    type: rss
    url: https://arstechnica.com/ai/feed/
    beats: [ai]
    weight: 1.4
    poll_interval: 2h
    kind: news
    enrichment: false
    enabled: true

  # kind: news. robots.txt (venturebeat.com) explicitly ALLOWS AI crawlers by name
  # (Google-Extended, GPTBot, ClaudeBot, Claude-Web, anthropic-ai, PerplexityBot each get
  # `Allow: /`) — the opposite policy from Ars Technica/Dark Reading/ap-news above, so
  # `enrichment` is left at its true default.
  #
  # IMPORTANT rejected URL, kept here so a future edit doesn't "fix" this back to something
  # broken: venturebeat.com/category/ai/feed LOOKS like the more precisely-scoped choice and
  # 200s, but live-verified 2026-08-14 to be STALE — served from a Vercel edge cache
  # (`x-vercel-cache: HIT`, `age: 277`) frozen at a newest entry of 2026-05-19, three months
  # stale, reproduced on repeated fetches. This is the exact trap CLAUDE.md's "How to add a
  # source" warns about: a 200, real, parseable feed that is not sorted/updating the way it
  # looks. The plain site-wide url below is used instead, verified fresh (newest 23.7h old)
  # and — VentureBeat's current editorial focus being what it is — every sampled title in it
  # was already AI content with no keyword filtering needed (e.g. "Three Claude agents given
  # conflicting orders sabotaged each other on a shared server…", "Google's Gemini 3.7 Flash
  # targets coding and agents…").
  - id: venturebeat
    name: VentureBeat
    type: rss
    url: https://venturebeat.com/feed/
    beats: [ai]
    weight: 1.3
    poll_interval: 2h
    kind: news
    enabled: true

  # kind: blog — Jack Clark's independent AI-policy/research newsletter (Substack), analysis
  # and commentary in the author's own voice rather than third-party reporting — same
  # category as simonwillison/latent-space, not `news`. robots.txt
  # (importai.substack.com) disallows Substack's own account/session/embed machinery for
  # the `*` group (nothing that touches /feed) and fully blocks one SEO-scraper bot
  # (BLEXBot) by name; no AI-crawler-specific restriction found, so `enrichment` stays at
  # its true default. Actual publishing cadence is roughly weekly (verified entries at
  # 2026-08-10, 08-03, 07-27, 07-20, 07-06); poll_interval set to 1d to match, generously,
  # rather than polling many times between real updates.
  # Live-verified 2026-08-14, 20 entries, newest 103.4h old ("Import AI 468: 23 RSI ideas;
  # PostTrainBench+; and how trust and transp…").
  - id: import-ai
    name: Import AI (Jack Clark)
    type: rss
    url: https://importai.substack.com/feed
    beats: [ai]
    weight: 1.3
    poll_interval: 1d
    kind: blog
    enabled: true

  # kind: blog — OpenAI's own blog, official first-party announcements, same category as
  # deepmind-blog/huggingface-blog above, not third-party `news`. robots.txt (openai.com)
  # is allow-all (`Allow: /`, one unrelated Disallow for /microsoft-for-startups/) — no
  # AI-crawler restriction, unsurprising for a company whose own products depend on being
  # crawled; `enrichment` stays at its true default.
  #
  # NOTE, not disqualifying: this is a FULL ARCHIVE dump, not a rolling window — 1,129
  # entries live-verified 2026-08-14, oldest observed pubDate 2015-12-11, and neither ETag
  # nor Last-Modified is sent (no conditional-GET support observed), so every poll re-reads
  # the whole ~669 KB body. Comfortably under politeFetch's 5 MiB default ceiling regardless
  # (no MAX_BYTES_OVERRIDES entry needed), and the same "first ingest pulls in a large
  # historical batch" shape CISA KEV's 1,665-entry catalog already established as acceptable
  # — decay handles the old entries at read time, nothing else needs to change.
  # /blog/rss.xml (the URL named in the plan) 307-redirects to the news/rss.xml url below;
  # configured directly to skip the hop.
  # Newest entry at verification time: 33.0h old ("The builder's guide to GPT‑5.6").
  - id: openai-blog
    name: OpenAI Blog
    type: rss
    url: https://openai.com/news/rss.xml
    beats: [ai]
    weight: 1.2
    poll_interval: 6h
    kind: blog
