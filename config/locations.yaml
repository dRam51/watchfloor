# The curated infrastructure gazetteer (§7.2, M7). Validated by
# src/locations/load.ts; a malformed row fails at load, never at render.
#
# ===========================================================================
# WHAT THIS FILE IS, AND WHAT IT DELIBERATELY IS NOT
# ===========================================================================
#
# §7.2: "Build it as an infrastructure map, not a news globe -- the useful
# spatial question isn't 'where did news happen', it's 'where does the
# physical capacity sit and which jurisdictions constrain it.'"
#
# So this is a map of THE AI BUILDOUT: leading-edge logic and memory fabs,
# advanced packaging, the equipment and materials chokepoints, and the
# hyperscale compute footprint. It is an industry dataset and it includes
# operators nobody could hold -- SMIC, Huawei, Alibaba -- because the question
# is where the capacity is, not who owns what.
#
# **This repository is public.** §7.2 suggests seeding from the brief's §11
# holdings; this file deliberately was NOT built that way. Each individual
# fact here is public knowledge, but a curated list of exactly one person's
# positions and nothing else is a portfolio disclosure by inference, which is
# the thing .gitignore protects config/portfolio.yaml and docs/brief.md from.
#
# **Anything holdings-specific belongs in `config/locations.local.yaml`** --
# gitignored, optional, merged over this file by location `id` when present.
# Its absence is normal operation and is never warned about.
#
# ===========================================================================
# THE RULE THAT KEEPS THIS HONEST
# ===========================================================================
#
# §7.2: "A curated, hand-maintained locations table -- DO NOT AUTO-GEOCODE."
#
# Every coordinate below arrives through a hand-written row with a citation
# and a date. No geocoding service is called anywhere in this system, ever --
# a geocoder answers "where is this string" with a plausible coordinate for
# any string, including a wrong one, and the failure is silent.
#
# `precision` is not in the brief and exists because the alternative is worse:
#
#   site    the coordinate locates the campus or facility itself
#   city    the coordinate is the town; the facility is somewhere in it
#   region  broader than a town -- a metro cluster or an industrial park
#
# A city centroid presented at site precision is a guess wearing a survey's
# authority. The UI draws these differently for that reason.
#
# `verified_at` IS THE DATE OF THE CITED SOURCE, not the date the row was
# typed. §7.2: "Expect this file to be wrong and stale in places -- build the
# UI to show verified_at so I know how much to trust a pin."
#
# Run `npm run watchfloor map check-sources` to HTTP-check every citation here
# and in config/jurisdictions.yaml.
#
# ===========================================================================
# FIELDS
# ===========================================================================
#
#   id          lowercase-hyphen slug, stable forever (the overlay merges on it)
#   name        display name
#   kind        fab | packaging | datacenter | colo | cloud_region | hq | port
#   operator    display text for who runs it
#   country     ISO 3166-1 alpha-2; MUST have a row in config/jurisdictions.yaml
#   lat / lon   decimal degrees
#   precision   site | city | region -- see above
#   city        the settlement. Required when precision is `site`, because the
#               operator+place matching tier is how most facility mentions
#               actually arrive ("Intel" plus "Chandler" is a location claim;
#               "Intel" alone is not, ever -- see src/locations/gazetteer.ts)
#   aliases     spellings that attribute THIS SITE on their own. A bare string
#               is case-sensitive at confidence 0.9; use
#               {term:, match: loose, confidence:} to say otherwise.
#               Declare a LOW confidence for a generic spelling: "Veldhoven"
#               is near-certainly ASML, "Fab 18" is not near-certainly anyone.
#   entities    entity names from config/entities.yaml. Refused at load if one
#               does not exist. This is the join behind "click a ticker ->
#               highlight that company's facilities" and the supply arcs.

